models:
  - name: dim_carrier
    description: One row per carrier, keyed on BTS's unique carrier code.
    columns:
      - name: carrier_code
        description: > 
          BTS unique carrier code  (e. g. WN, DL). Use this over IATA code -
          IATA codes are reassigned to different carriers over time; see
          "Lookup tables" in docs/data_quality_notes.md.
        tests:
          - unique
          - not_null
      - name: carrier_iata_code
        description: >
          IATA carrier code (e.g. "FR" for Ryanair). Not the join key —
          Reporting_Airline (BTS's unique carrier code) is used for joins,
          since IATA codes are reassigned to different carriers over time.
          Carried here as an attribute since it's the identifier most
          commonly used in industry conversation. See "Lookup tables" in
          docs/data_quality_notes.md.
      - name: carrier_name
        description: Full carrier name (e.g. "Southwest Airlines Co.")

  - name: dim_cancellation_reason
    description: One row per cancellation reason code.
    columns:
      - name: cancellation_code
        description: >
          Single-letter code (A/B/C/D = Carrier/Weather/Nation Air System/ Security). Joins to stg_flights.cancellation_code
        tests:
          - unique
          - not_null
      - name: cancellation_reason
        description: Human-readable cacellation cause.

  - name: dim_delay_group
    description: >
      One row per 15-minutes delay band. Shared lookup for both departure and arrival delay groups.
    columns:
      - name: delay_group_code
        description: >
          Integer delay band, e.g. -1 = "-15 to -1 min early", 4 =
          "45-59 min late". Joins to stg_flights.departure_delay_group
          or arrival_delay_group.
        tests:
          - unique
          - not_null
      - name: delay_group_label
        description: Human-readable delay band description.
  - name: dim_date
    description: >
      Generated date spine, 1987-01-01 to 2050-12-31. Indepedent of what data is actually loaded. See "Date dimension and holiday flags in docs/data_quality_notes.md."
    columns:
      - name: date_day
        description: The calendar date. Primary key.
        tests:
          - unique
          - not null
      - name: year
        tests:
          - not null
      - name: month
        tests:
          - not null
      - name: month_name
        description: Full month name, e.g. "January".
      - name: day_of_month
      - name: day_of_week
        description: >
          BigQuery DAYOFWEEK convention: 1=Sunday .. 7=Saturday.
      - name: day_name
        description: Winter/Spring/Summer/Autumn, by metorological month.
      - name: holiday_name
        description: >
          US federal holiday name if date_day is a holiday, else null.
          Sourced from the holidays seed - see data_quality_notes.md.
      - name: is_holiday
        description: True if date_day is a US federal holiday.

  - name: fct_flights
    description: One row per operated flight leg. See stg_flights for
      full column derivation notes.
    columns:
      - name: flight_id
        description: Surrogate key, unique per physical flight.
        tests:
          - unique
          - not_null
      - name: carrier_code
        description: BTS unique carrier code. Foreign key to dim_carrier.
        tests:
          - relationships:
              arguments:
                to: ref('dim_carrier')
                field: carrier_code
      - name: cancellation_code
        description: >
          Single-letter cancellation reason. Foreign key to
          dim_cancellation_reason. Null for non-cancelled flights.
        tests:
          - relationships:
              arguments:
                to: ref('dim_cancellation_reason')
                field: cancellation_code
      - name: flight_outcome
        description: >
          Cancellation timing category. See "Cancellation timing" in
          docs/data_quality_notes.md.
        tests:
          - accepted_values:
              arguments:
                values: ['completed', 'diverted',
                        'cancelled_before_pushback',
                        'cancelled_after_pushback',
                        'cancelled_after_departure', 'cancelled_other']
      - name: was_diverted
        description: True if flight actually diverted (per BTS Diverted flag).
      - name: distance_miles
        description: Great-circle distance between origin and destination.
      - name: origin_airport
        tests:
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_code
      - name: destination_airport
        tests:
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_code

  - name: dim_airport
    description: >
      One row per airport code, combining origin and destination
      airports from stg_flights. Deliberately thin — no coordinates
      or timezone yet; see "dim_airport scope" in
      docs/data_quality_notes.md for the planned OurAirports
      extension.
    columns:
      - name: airport_code
        description: >
          IATA airport code (e.g. "ATL"). Verified stable per state
          across the full loaded date range — no airport code was
          found associated with more than one state.
        tests:
          - unique
          - not_null
      - name: state
        description: US state code where the airport is located.
        tests:
          - not_null

seeds:
  - name: holidays
    description: >
      US federal holiday, 1987-2050, generated via the Python 'holidays' 
      package. See "Date dimension and holiday flags" in docs/data_quality_notes.md
    columns:
      - name: holiday_date
        tests:
          - unique
          - not_null
      - name: holiday_name
        tests:
          - not null
